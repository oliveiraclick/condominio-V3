workflows:
  ios-capacitor-workflow:
    name: iOS Capacitor Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: NewKey

    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22.13.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          node -v
          npm install

      - name: Build web assets
        script: |
          npm run build

      - name: Generate assets manually
        script: |
          echo "Generating icons manually with sips..."
          ICON_SRC="assets/icon.png"
          ICON_DST="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p $ICON_DST
          sips -z 40 40     $ICON_SRC --out $ICON_DST/AppIcon-20x20@2x.png
          sips -z 60 60     $ICON_SRC --out $ICON_DST/AppIcon-20x20@3x.png
          sips -z 58 58     $ICON_SRC --out $ICON_DST/AppIcon-29x29@2x.png
          sips -z 87 87     $ICON_SRC --out $ICON_DST/AppIcon-29x29@3x.png
          sips -z 80 80     $ICON_SRC --out $ICON_DST/AppIcon-40x40@2x.png
          sips -z 120 120   $ICON_SRC --out $ICON_DST/AppIcon-40x40@3x.png
          sips -z 120 120   $ICON_SRC --out $ICON_DST/AppIcon-60x60@2x.png
          sips -z 180 180   $ICON_SRC --out $ICON_DST/AppIcon-60x60@3x.png
          sips -z 20 20     $ICON_SRC --out $ICON_DST/AppIcon-20x20@1x.png
          sips -z 29 29     $ICON_SRC --out $ICON_DST/AppIcon-29x29@1x.png
          sips -z 40 40     $ICON_SRC --out $ICON_DST/AppIcon-40x40@1x.png
          sips -z 76 76     $ICON_SRC --out $ICON_DST/AppIcon-76x76@1x.png
          sips -z 152 152   $ICON_SRC --out $ICON_DST/AppIcon-76x76@2x.png
          sips -z 167 167   $ICON_SRC --out $ICON_DST/AppIcon-83.5x83.5@2x.png
          sips -z 1024 1024 $ICON_SRC --out $ICON_DST/AppIcon-512@2x.png
          echo "Verifying icons..."
          ls -l $ICON_DST

      - name: Capacitor sync
        script: |
          node -v
          npx cap sync ios

      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      # 🔥 AQUI ESTÁ A CORREÇÃO DEFINITIVA
      - name: Build ipa for distribution
        script: |
          BUILD_NUMBER=$(date +%s)
          echo "Using build number: $BUILD_NUMBER"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --build-number $BUILD_NUMBER

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - ia.oliveira.click@gmail.com
        notify:
          success: true
          failure: true

      app_store_connect:
        auth: integration
        submit_to_testflight: false


  android-capacitor-workflow:
    name: Android Capacitor Build
    max_build_duration: 120
    instance_type: linux_x2

    environment:
      android_signing:
        - keystore_reference
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "app.morador.app"
      node: 22.13.0

    scripts:
      - name: Install dependencies
        script: |
          node -v
          npm install

      - name: Build web assets
        script: |
          npm run build

      - name: Generate assets manually
        script: |
          echo "Generating Android icons manually..."
          npx @capacitor/assets generate --android
          echo "Verifying Android assets..."
          ls -R android/app/src/main/res/mipmap*

      - name: Capacitor sync
        script: |
          node -v
          npx cap sync android

      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Build Android release
        script: |
          cd android
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - ia.oliveira.click@gmail.com
        notify:
          success: true
          failure: true

      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true