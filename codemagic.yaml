workflows:
  ios-capacitor-workflow:
    name: iOS Capacitor Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: morador.app
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.morador.app
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22.13.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          node -v
          npm install
      - name: Build web assets
        script: |
          npm run build
      - name: Generate assets
        script: |
          echo "Generating iOS assets..."
          npx @capacitor/assets generate --ios
          echo "Verifying AppIcon.appiconset content..."
          ls -R ios/App/App/Assets.xcassets/AppIcon.appiconset/
      - name: Capacitor sync
        script: |
          node -v
          npx cap sync ios
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - ia.oliveira.click@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: false # Mudança aqui: Apenas faz o upload, não fica esperando
        expire_testflight_builds: true

  android-capacitor-workflow:
    name: Android Capacitor Build
    ... (restante igual)
